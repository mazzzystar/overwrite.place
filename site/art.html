<!DOCTYPE html>
<html lang="<!--{{LANG}}-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--{{HEAD}}-->
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1FGGJB0JDN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1FGGJB0JDN');
</script>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="art-page">

<nav class="nav-pill visible" aria-label="overwrite.place">
  <a href="<!--{{HOME}}-->" class="nav-brand">overwrite.place</a>
  <div class="nav-links">
    <a href="<!--{{HOME}}-->#gallery">Gallery</a>
    <a href="<!--{{HOME}}-->#draw" class="btn btn-primary nav-cta"><!--{{T_NAV_CTA}}--></a>
    <!--{{LANG_SWITCH}}-->
  </div>
</nav>

<main class="art-main">
  <div class="hero">
    <div class="hero-frame">
      <div class="hero-canvas">
        <img src="<!--{{IMAGE}}-->" alt="<!--{{MESSAGE}}-->" width="64" height="64" fetchpriority="high">
        <div class="grain"></div>
      </div>
    </div>
    <div class="hero-badge">No. <!--{{NO}}--></div>
  </div>

  <div class="meta">
    <a class="meta-author" href="<!--{{AUTHORLINK}}-->" rel="noopener">@<!--{{AUTHOR}}--></a>
    <span class="meta-dot"></span>
    <!--{{MODEL}}-->
  </div>

  <div class="message">「<!--{{MESSAGE}}-->」</div>

  <div class="alive">
    <div class="alive-kicker"><!--{{LIFE_LABEL}}--></div>
    <div class="alive-timer"><!--{{LIFE}}--></div>
  </div>

  <div class="art-born"><!--{{T_ART_BORN}}--> <time datetime="<!--{{BORN}}-->"><!--{{BORN_LABEL}}--></time><!--{{COMMIT}}--></div>

  <div class="art-pager">
    <!--{{PREV}}-->
    <a class="btn btn-secondary" href="<!--{{SHARE}}-->" download><!--{{T_ART_DOWNLOAD}}--></a>
    <!--{{NEXT}}-->
  </div>

  <div class="art-back"><a href="<!--{{HOME}}-->"><!--{{T_ART_BACK}}--></a></div>
</main>

<footer class="footer">
  <div class="footer-row">
    <div>
      <div class="footer-brand">overwrite.place</div>
      <div class="footer-note"><!--{{T_FOOTER_NOTE}}--></div>
    </div>
    <div class="footer-links">
      <a href="<!--{{HOME}}-->#gallery">Gallery</a>
      <!--{{FOOTER_GUIDE}}-->
      <a href="<!--{{HOME}}-->"><!--{{T_FOOTER_BACK}}--></a>
    </div>
  </div>
</footer>

</body>
</html>
