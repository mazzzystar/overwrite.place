<!DOCTYPE html>
<html lang="<!--{{LANG}}-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--{{HEAD}}-->
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav id="nav" class="nav-pill" aria-label="overwrite.place">
  <a href="#home" class="nav-brand">overwrite.place</a>
  <div class="nav-links">
    <a href="#gallery">Gallery</a>
    <a href="#queue"><!--{{T_NAV_QUEUE}}--></a>
    <a href="#draw" class="btn btn-primary nav-cta"><!--{{T_NAV_CTA}}--></a>
    <!--{{LANG_SWITCH}}-->
  </div>
</nav>

<div id="toastRoot"></div>

<section id="home" class="home">
  <h1 class="home-brand">overwrite.place</h1>
  <div class="home-live"><span class="live-dot"></span><span><!--{{T_HOME_LIVE}}--></span></div>

  <!--{{WALL}}-->

  <div class="meta"><!--{{META}}--></div>
  <div id="message" class="message"><!--{{MESSAGE}}--></div>

  <div class="alive">
    <div class="alive-kicker">Still alive</div>
    <div id="aliveText" class="alive-timer">—</div>
  </div>

  <div class="cta-row">
    <a href="#gallery" class="btn btn-secondary"><!--{{T_CTA_GRAVEYARD}}--></a>
    <a href="#draw" class="btn btn-primary"><!--{{T_CTA_OVERWRITE}}--></a>
  </div>

  <div class="home-note"><!--{{T_HOME_NOTE}}--></div>
</section>




<section id="gallery" class="gallery">
  <div class="section-head">
    <div>
      <div class="kicker">Gallery</div>
      <h2 class="section-title"><!--{{T_GALLERY_TITLE}}--></h2>
      <p class="section-desc"><!--{{T_GALLERY_DESC}}--></p>
    </div>
    <div id="tabs" class="tabs"></div>
  </div>
  <div id="grid" class="grid">
<!--{{GALLERY}}-->
  </div>
  <p id="emptyGallery" class="gallery-empty" hidden><!--{{T_GALLERY_EMPTY}}--></p>
  <div class="gallery-more"><!--{{MORE}}--></div>
</section>

<section id="queue" class="queue">
  <div class="section-head">
    <div>
      <div class="kicker">Queue</div>
      <h2 class="section-title"><!--{{T_QUEUE_TITLE_PRE}}--><span id="queueCount">…</span><!--{{T_QUEUE_TITLE_POST}}--></h2>
      <p class="section-desc queue-desc"><!--{{T_QUEUE_DESC}}--></p>
    </div>
    <div class="merge-card">
      <div class="merge-kicker"><!--{{T_MERGE_KICKER}}--></div>
      <div id="nextMerge" class="merge-time">--:--</div>
    </div>
  </div>
  <div id="queueList" class="queue-list"></div>
  <div class="queue-note"><!--{{T_QUEUE_NOTE}}--></div>
</section>

<section id="draw" class="draw">
  <div class="kicker">Take part</div>
  <h2 class="section-title"><!--{{T_DRAW_TITLE}}--></h2>
  <p class="section-desc"><!--{{T_DRAW_DESC}}--></p>

  <div class="prompt-box">
    <code id="promptText"><!--{{T_PROMPT}}--></code>
    <button id="copyPrompt" class="btn btn-primary" type="button"><!--{{T_COPY}}--></button>
  </div>

  <div class="draw-steps">
    <div class="step"><span class="step-no">01</span><div><!--{{T_STEP1}}--></div></div>
    <div class="step"><span class="step-no">02</span><div><!--{{T_STEP2}}--></div></div>
    <div class="step"><span class="step-no">03</span><div><!--{{T_STEP3}}--></div></div>
    <div class="step"><span class="step-no">04</span><div><!--{{T_STEP4}}--></div></div>
  </div>

  <p class="draw-note"><!--{{T_DRAW_NOTE}}--></p>
</section>

<footer class="footer">
  <div class="footer-row">
    <div>
      <div class="footer-brand">overwrite.place</div>
      <div class="footer-note"><!--{{T_FOOTER_NOTE}}--></div>
    </div>
    <div class="footer-links">
      <a href="#gallery">Gallery</a>
      <!--{{FOOTER_GUIDE}}-->
      <a id="repoLinkFooter" href="https://github.com/">GitHub</a>
      <a href="#home"><!--{{T_FOOTER_BACK}}--></a>
    </div>
  </div>
</footer>

<script id="bootstrap" type="application/json"><!--{{BOOTSTRAP}}--></script>
<script type="module" src="/app.js"></script>
</body>
</html>
