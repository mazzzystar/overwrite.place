name: merge queue

# The interval is a floor under the *current* artwork's life, not a metronome:
# without one, ten pull requests landing together would give nine of them a
# lifespan of seconds. It is deliberately short — a minute — because verifying
# a pull request already takes longer than that, so in practice the floor is
# almost always met by the time anything is ready to merge.
#
# This runs the moment a pull request is verified and merges straight away when
# the floor is met. Waiting for a clock tick while nobody is being protected is
# just dead time.
#
# workflow_run rather than a `labeled` trigger: labels applied with GITHUB_TOKEN
# raise no events, so this would never fire.

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
  schedule:
    # Backstop only, for the one case workflow_run cannot cover: a pull request
    # verified while the floor was still unmet, with no other verify run behind
    # it to wake the queue again. Five minutes is as fine-grained as GitHub cron
    # goes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  release-one:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Merge the artwork that has waited longest
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          # --limit matters: gh defaults to 30, so past thirty queued artworks
          # this would merge the oldest of an arbitrary window rather than the
          # oldest overall, and the rest could starve.
          PR=$(gh pr list --state open --label verified --limit 200 \
                 --json number,createdAt,headRefOid,author,isDraft \
                 --jq 'map(select(.isDraft | not)) | sort_by(.createdAt) | .[0] // empty')
          if [ -z "$PR" ]; then
            echo "队列是空的。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read -r NUMBER AUTHOR HEAD_SHA <<<"$(echo "$PR" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const p=JSON.parse(s);console.log(p.number,p.author.login,p.headRefOid);});")"

          # Has the artwork on the wall had its minute? If so, this one goes up
          # now. If not, leave it labelled and let the cron come back — the only
          # thing that wait buys is the guarantee made to whoever is up there.
          WAIT=$(node -e "
            import('./scripts/lib/timeline.js').then(({ buildTimeline }) => {
              const floorMs = require('./config.json').queue.mergeIntervalMinutes * 60000;
              const live = buildTimeline().artworks.at(-1);
              const upFor = live ? Date.now() - (live.aliveSince ?? live.bornAt) : Infinity;
              console.log(Math.max(0, Math.ceil((floorMs - upFor) / 1000)));
            });")

          if [ "$WAIT" -gt 0 ]; then
            echo "首页那幅还没活满保底时长，还差 ${WAIT} 秒。PR #${NUMBER} 留在队列里等下一次。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The `verified` label was applied when the pull request was pushed,
          # which may have been hours ago, and main has moved since. Re-checking
          # against the tree we are about to merge into is what catches a pull
          # request that was fine then and is not now.
          git fetch --no-tags origin "+refs/pull/${NUMBER}/head:refs/remotes/pr/head"

          # --require-kind is what stops this from merging a pull request that
          # is carrying the label but no longer contains an artwork.
          if ! node scripts/ci-check.js \
                 --author "$AUTHOR" \
                 --base "$(git rev-parse HEAD)" \
                 --head refs/remotes/pr/head \
                 --require-kind submission \
                 --report "$RUNNER_TEMP/recheck.md" >> "$GITHUB_STEP_SUMMARY"; then
            gh pr edit "$NUMBER" --remove-label verified --add-label needs-changes
            gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/recheck.md"
            echo "PR #${NUMBER} 在合并前复检没通过，已退回队列。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --match-head-commit pins the merge to the commit ci-check just read.
          # Without it an author could push between the check and the merge, and
          # this is the only point in the design where the pull request's tree
          # reaches main at all.
          set +e
          gh pr merge "$NUMBER" --squash --match-head-commit "$HEAD_SHA"
          MERGE_STATUS=$?
          set -e

          # Never infer the outcome from gh's exit code. A merge can succeed and
          # gh still exit non-zero on something afterwards; with `set -e` that
          # would abort before `merged=true` is written, the deploy would be
          # skipped, and the site would keep showing the previous artwork as
          # alive while main already held the new one. Ask GitHub instead.
          STATE=$(gh pr view "$NUMBER" --json state --jq .state)

          if [ "$STATE" = "MERGED" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "已合并 PR #${NUMBER}（@${AUTHOR}）。" >> "$GITHUB_STEP_SUMMARY"
            # Best effort, and deliberately after the outcome is recorded: head
            # branches on forks are not ours to delete.
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$(gh pr view "$NUMBER" --json headRefName --jq .headRefName)" || true
            exit 0
          fi

          # It did not merge. Take the label off so this pull request stops being
          # the permanent head of the queue and blocking everyone behind it.
          gh pr edit "$NUMBER" --remove-label verified --add-label needs-changes
          gh pr comment "$NUMBER" --body "$(printf '### ⚠️ 合并没有成功\n\n队列尝试合并这个 PR 但没有成功（gh 退出码 %s，当前状态 %s）。常见原因是有冲突、分支落后于 main，或者你在校验之后又推了新的 commit。\n\n把分支同步到最新的 main 再推一次，校验会重新跑。' "$MERGE_STATUS" "$STATE")"
          echo "PR #${NUMBER} 合并失败（状态 ${STATE}），已退回队列，不阻塞后面的作品。" >> "$GITHUB_STEP_SUMMARY"

  # A merge made with GITHUB_TOKEN does not raise a push event, so the deploy
  # has to be called rather than waited for.
  deploy:
    needs: release-one
    if: needs.release-one.outputs.merged == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
